<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>浪漫至死不渝 · 李然</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --pink: #ea80b0;
    --pink-soft: rgba(234, 128, 176, .7);
    --bg: #000;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Dosis', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* 爱心中间淡淡的柔光 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    background: radial-gradient(circle at 50% 47%, rgba(234, 128, 176, .09), rgba(234, 128, 176, .02) 26%, transparent 44%);
    pointer-events: none;
  }

  #ui {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    transform-origin: 50% 50%;
  }

  #ui .love {
    position: absolute;
    top: 50%;
    left: 50%;
    margin: -225px 0 0 -225px;
    will-change: transform;
  }

  #ui .love_horizontal {
    animation: horizontal 10000ms infinite alternate ease-in-out;
    animation-delay: var(--delay);
  }

  #ui .love_vertical {
    animation: vertical 20000ms infinite linear;
    animation-delay: var(--delay);
  }

  #ui .love_word {
    color: var(--pink);
    font-size: 1.6rem;
    transform: translate(-50%, -100%) rotateZ(-30deg);
    font-family: 'Dosis', 'Segoe UI', sans-serif;
    letter-spacing: 2px;
    white-space: nowrap;
    opacity: .92;
    text-shadow: 0 0 10px rgba(234, 128, 176, .14);
  }

  @keyframes horizontal {
    from { transform: translateX(0px); }
    to   { transform: translateX(450px); }
  }

  @keyframes vertical {
    0%      { transform: translateY(180px); }
    10%     { transform: translateY(45px); }
    15%     { transform: translateY(4.5px); }
    18%     { transform: translateY(0px); }
    20%     { transform: translateY(4.5px); }
    22%     { transform: translateY(34.61538px); }
    24%     { transform: translateY(64.28571px); }
    25%     { transform: translateY(112.5px); }
    26%     { transform: translateY(64.28571px); }
    28%     { transform: translateY(34.61538px); }
    30%     { transform: translateY(4.5px); }
    32%     { transform: translateY(0px); }
    35%     { transform: translateY(4.5px); }
    40%     { transform: translateY(45px); }
    50%     { transform: translateY(180px); }
    71%     { transform: translateY(428.57143px); }
    72.5%   { transform: translateY(441.17647px); }
    75%     { transform: translateY(450px); }
    77.5%   { transform: translateY(441.17647px); }
    79%     { transform: translateY(428.57143px); }
    100%    { transform: translateY(180px); }
  }

  /* 爱心中间的名字 */
  .name-wrap {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .name {
    margin: -2vh 0 0;
    font-family: 'STKaiti', 'KaiTi', 'Kaiti SC', 'Noto Serif SC', 'Songti SC', serif;
    font-size: clamp(42px, 9vmin, 78px);
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: .08em;
    margin-right: -.08em;
    color: #fff;
    text-shadow:
      0 0 12px rgba(255, 255, 255, .55),
      0 0 34px rgba(234, 128, 176, .8),
      0 0 72px rgba(234, 128, 176, .45);
    animation: nameBreath 3.6s ease-in-out infinite;
  }

  @keyframes nameBreath {
    0%, 100% { transform: scale(1); opacity: .96; }
    50%      { transform: scale(1.045); opacity: 1; }
  }

  /* 开场信封 */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fff;
    cursor: pointer;
    opacity: 1;
    visibility: visible;
    transition: opacity .75s ease, visibility .75s ease;
    user-select: none;
  }

  #splash.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .letter {
    width: clamp(150px, 22vw, 200px);
    border-radius: 4px;
    animation: letterBeat 1.25s ease-in-out infinite;
  }

  .letter img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 4px;
    box-shadow: 0 0 10px #999;
  }

  #splash p {
    margin: 18px 0 0;
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    font-size: clamp(20px, 2.2vw, 26px);
    letter-spacing: .06em;
    color: #111;
    animation: hintPulse 1.25s ease-in-out infinite;
  }

  @keyframes letterBeat {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }

  @keyframes hintPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.08); }
  }

  /* 小屏时整体缩小爱心，保证完整显示 */
  @media (max-width: 560px), (max-height: 560px) {
    #ui { transform: scale(.82); }
  }
  @media (max-width: 430px), (max-height: 430px) {
    #ui { transform: scale(.47); }
  }
  @media (max-width: 340px) {
    #ui { transform: scale(.42); }
  }
</style>
</head>

    const ui = document.getElementById('ui');
    const fragment = document.createDocumentFragment();

    words.forEach((word, index) => {
      const love = document.createElement('div');
      love.className = 'love';
      love.style.setProperty('--delay', `${-(index + 1) * 300}ms`);

      const horizontal = document.createElement('div');
      horizontal.className = 'love_horizontal';
      const vertical = document.createElement('div');

    ui.appendChild(fragment);

    const splash = document.getElementById('splash');

    function openPage() {
      splash.classList.add('hide');
      document.body.classList.add('opened');
    }

    splash.addEventListener('click', openPage);
    splash.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openPage();
      }
    });

    // 方便直接预览爱心效果
    if (location.hash === '#heart') {
